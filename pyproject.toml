[project]
name = "gridworks-connector-dev"
version = "0.1.0b4"
requires-python = ">=3.14.2"
dependencies = ["paho-mqtt==2.1.0", "pydantic==2.14.1", "astral==2.2"]

[dependency-groups]
dev = ["homeassistant==2026.11.0", "pytest-homeassistant==2026.11.0", "home-assistant-frontend==20261028.4", "pytest==9.0.3", "pytest-asyncio==1.4.0", "ruff==0.17.3", "jsonschema==4.26.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
