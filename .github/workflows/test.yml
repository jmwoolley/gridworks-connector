name: Connector checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CONNECTOR_TEST_BROKER: '1'
    services:
      rabbitmq:
        image: rabbitmq:4.1-management
        env:
          RABBITMQ_DEFAULT_USER: connector_test
          RABBITMQ_DEFAULT_PASS: ephemeral_ci_only
        ports:
          - 1885:1883
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Enable MQTT on ephemeral development broker
        run: docker exec ${{ job.services.rabbitmq.id }} rabbitmq-plugins enable rabbitmq_mqtt
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.11.0 pytest-homeassistant==2026.11.0 pydantic==2.14.3 paho-mqtt==2.1.0 ruff==0.17.3 jsonschema==4.26.0
      - run: ruff check custom_components/gridworks_connector tests tools
      - run: python -m tools.run_tests -q
      - run: python -m tools.generate_schemas
      - run: git diff --exit-code docs/proposed-sema
      - run: python -m tools.build_package
      - uses: actions/upload-artifact@v4
        with:
          name: gridworks-connector-draft
          path: dist/*
          retention-days: 7
