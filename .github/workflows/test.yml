name: Connector checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CONNECTOR_TEST_BROKER: '1'
      CONNECTOR_UI_FIXTURE: 'dist/commissioning-ui-fixture.json'
    services:
      rabbitmq:
        image: rabbitmq:4.1-management
        env:
          RABBITMQ_DEFAULT_USER: connector_test
          RABBITMQ_DEFAULT_PASS: ephemeral_ci_only
        ports:
          - 1885:1883
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Enable MQTT on ephemeral development broker
        run: docker exec ${{ job.services.rabbitmq.id }} rabbitmq-plugins enable rabbitmq_mqtt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.11.0 pytest-homeassistant==2026.11.0 ruff==0.17.3 jsonschema==4.26.0
      - name: Install component dependencies with Home Assistant package constraints
        run: python -m tools.install_ha_requirements
      - run: ruff check custom_components/gridworks_connector tests tools
      - run: node --check custom_components/gridworks_connector/frontend/commissioning.js
      - run: python -m tools.run_tests -q
      - run: python -m tools.generate_schemas
      - run: python -m tools.generate_examples
      - run: git diff --exit-code docs/proposed-sema
      - run: python -m tools.build_package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gridworks-connector-draft
          path: dist/*
          retention-days: 7
